spring.application.name=Nico

# 1. Conexão com o banco de dados 
spring.datasource.url=jdbc:postgresql://localhost:5432/db_nico
spring.datasource.username=postgres
spring.datasource.password=Nico@4321

# 2. Comportamento do Hibernate (Cria as tabelas automaticamente)
spring.jpa.hibernate.ddl-auto=update

# 3. (Opcional mas recomendado) Mostra o SQL gerado no terminal do VS Code
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha'